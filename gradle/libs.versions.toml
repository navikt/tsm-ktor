[versions]
kotlin = "2.4.20"
jackson = "3.2.3"

# Core
otel = "2.31.1"
slf4j = "2.0.20"
prometheus = "1.17.1"
khealth = "3.0.2"
logback = "1.6.5"
logback-encoder = "9.0"

# Kafka
kafka = "4.3.1"

# Kafka Sykmeldinger
tsm-sykmeldinger-input = "30"

# Testing
kotest-assertions = "6.2.5"
junit-jupiter-engine = "6.1.3"
spotless = "8.10.3"
testcontainers = "2.0.5"
mockk = "1.14.11"

[libraries]
# Core
otel-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations", version.ref = "otel" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson"}
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheus" }
khealth = { module = "dev.hayden:khealth", version.ref = "khealth" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logback-encoder"}


# Kafka
kafka-client = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }

# Kafka Sykmeldinger
tsm-sykmeldinger-input = { module = "no.nav.tsm.sykmelding:input", version.ref = "tsm-sykmeldinger-input" }

# Testing
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest-assertions" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
